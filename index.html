<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📒 Khata Index</title>
    <meta name="description" content="A digital ledger index to track names and page numbers, powered by Google Sheets.">

    <!-- Tailwind CSS for a modern, responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jsPDF library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Button press feedback */
        .btn-press:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        /* Sortable headers */
        .sortable-header {
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }
        .sortable-header:hover { background-color: #334155; }

        /* ---- Loading spinner ---- */
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Toast notification ---- */
        #toast {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #toast.hide {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* ---- Row fade-in ---- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #entries-table-body tr {
            animation: fadeIn 0.2s ease both;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans antialiased">

    <!-- ======================================================
         TOAST NOTIFICATION
    ====================================================== -->
    <div id="toast"
         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-medium hide
                flex items-center gap-2 min-w-[220px] justify-center">
    </div>

    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-4xl">

        <!-- App Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-bold">📒 Khata Index</h1>
            <!-- DB Status badge -->
            <div class="mt-2 flex justify-center">
                <span id="db-status"
                      class="inline-flex items-center gap-1.5 text-xs px-3 py-1 rounded-full
                             bg-slate-700 text-slate-400 font-medium">
                    <span id="db-status-dot" class="w-2 h-2 rounded-full bg-slate-500 inline-block"></span>
                    <span id="db-status-text">Connecting…</span>
                </span>
            </div>
        </header>

        <main>
            <!-- ================================================
                 ADD ENTRY FORM
            ================================================ -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg mb-8">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Add New Entry</h2>
                <form id="entry-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-300 mb-1">Name</label>
                        <input type="text" id="name" name="name" placeholder="e.g., John Doe" required
                               class="w-full bg-slate-700 text-white rounded-md border-slate-600
                                      focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                                      transition px-3 py-2">
                    </div>
                    <div>
                        <label for="page-number" class="block text-sm font-medium text-slate-300 mb-1">Page Number</label>
                        <input type="number" id="page-number" name="page-number" placeholder="e.g., 121" required
                               class="w-full bg-slate-700 text-white rounded-md border-slate-600
                                      focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                                      transition px-3 py-2">
                    </div>
                    <button type="submit" id="add-btn"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold
                                   py-2 px-4 rounded-md transition duration-200 btn-press
                                   flex items-center justify-center gap-2 disabled:opacity-50">
                        <span id="add-btn-label">Add Entry</span>
                        <span id="add-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    </button>
                </form>
            </div>

            <!-- ================================================
                 ENTRIES TABLE CARD
            ================================================ -->
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                    <h2 class="text-xl font-semibold">All Entries</h2>
                    <div class="w-full sm:w-auto flex gap-2">
                        <input type="text" id="search-bar" placeholder="🔍 Search by name..."
                               class="w-full sm:w-48 bg-slate-700 text-white rounded-md border-slate-600
                                      focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                                      transition px-3 py-2">
                        <button id="export-pdf-btn"
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold
                                       py-2 px-4 rounded-md transition duration-200 btn-press whitespace-nowrap">
                            Export PDF
                        </button>
                    </div>
                </div>

                <!-- Loading state -->
                <div id="loading-state" class="py-12">
                    <div class="spinner"></div>
                    <p class="text-center text-slate-400 mt-4 text-sm">Loading from Google Sheets…</p>
                </div>

                <!-- Table -->
                <div id="table-wrapper" class="overflow-x-auto hidden">
                    <table class="min-w-full text-left">
                        <thead class="bg-slate-700/50">
                            <tr>
                                <th class="p-3 font-semibold text-sm w-1/6">Letter</th>
                                <th id="sort-name-header" class="sortable-header p-3 font-semibold text-sm w-3/6">
                                    Name <span id="sort-name-indicator"></span>
                                </th>
                                <th id="sort-page-header" class="sortable-header p-3 font-semibold text-sm w-1/6">
                                    Page No. <span id="sort-page-indicator"></span>
                                </th>
                                <th class="p-3 font-semibold text-sm w-1/6 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="entries-table-body" class="divide-y divide-slate-700">
                            <!-- JS populates this -->
                        </tbody>
                    </table>
                    <p id="no-entries-message" class="text-center text-slate-400 py-8 hidden">
                        No entries found. Add one using the form above!
                    </p>
                </div>
            </div>
        </main>
    </div>

    <!-- ======================================================
         EDIT MODAL
    ====================================================== -->
    <div id="edit-modal"
         class="fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center p-4 hidden z-50">
        <div class="bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h2 class="text-xl font-semibold mb-4">Edit Entry</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="mb-4">
                    <label for="edit-name" class="block text-sm font-medium text-slate-300 mb-1">Name</label>
                    <input type="text" id="edit-name" required
                           class="w-full bg-slate-700 text-white rounded-md px-3 py-2
                                  focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-6">
                    <label for="edit-page-number" class="block text-sm font-medium text-slate-300 mb-1">Page Number</label>
                    <input type="number" id="edit-page-number" required
                           class="w-full bg-slate-700 text-white rounded-md px-3 py-2
                                  focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="cancel-edit-btn"
                            class="bg-slate-600 hover:bg-slate-700 text-white font-bold
                                   py-2 px-4 rounded-md transition btn-press">
                        Cancel
                    </button>
                    <button type="submit" id="save-edit-btn"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold
                                   py-2 px-4 rounded-md transition btn-press
                                   flex items-center gap-2 disabled:opacity-50">
                        <span>Save Changes</span>
                        <span id="edit-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ======================================================
         DELETE CONFIRMATION MODAL
    ====================================================== -->
    <div id="delete-confirm-modal"
         class="fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center p-4 hidden z-50">
        <div class="bg-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
            <h2 class="text-xl font-semibold mb-2">Are you sure?</h2>
            <p class="text-slate-300 mb-6">This action cannot be undone.</p>
            <div class="flex justify-center gap-3">
                <button id="cancel-delete-btn"
                        class="bg-slate-600 hover:bg-slate-700 text-white font-bold
                               py-2 px-4 rounded-md transition btn-press w-24">
                    Cancel
                </button>
                <button id="confirm-delete-btn"
                        class="bg-red-600 hover:bg-red-700 text-white font-bold
                               py-2 px-4 rounded-md transition btn-press w-24
                               flex items-center justify-center gap-1 disabled:opacity-50">
                    <span>Delete</span>
                    <span id="delete-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- ======================================================
         MAIN SCRIPT
    ====================================================== -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --------------------------------------------------------
        //  ⚙️  CONFIGURATION
        //  After deploying your Apps Script Web App, paste the URL below.
        // --------------------------------------------------------
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6nKrwhPiaeVcT83arE42TtiPuKtPSatnF_ke-KwqIRem-2FdQIkX-YqJOBg1nvD4e/exec';

        // --------------------------------------------------------
        //  DOM ELEMENTS
        // --------------------------------------------------------
        const entryForm          = document.getElementById('entry-form');
        const nameInput          = document.getElementById('name');
        const pageNumberInput    = document.getElementById('page-number');
        const tableBody          = document.getElementById('entries-table-body');
        const searchBar          = document.getElementById('search-bar');
        const noEntriesMessage   = document.getElementById('no-entries-message');
        const loadingState       = document.getElementById('loading-state');
        const tableWrapper       = document.getElementById('table-wrapper');

        // Status badge
        const dbStatusDot        = document.getElementById('db-status-dot');
        const dbStatusText       = document.getElementById('db-status-text');

        // Add button / spinner
        const addBtn             = document.getElementById('add-btn');
        const addBtnLabel        = document.getElementById('add-btn-label');
        const addSpinner         = document.getElementById('add-spinner');

        // Edit Modal
        const editModal          = document.getElementById('edit-modal');
        const editForm           = document.getElementById('edit-form');
        const editIdInput        = document.getElementById('edit-id');
        const editNameInput      = document.getElementById('edit-name');
        const editPageNumberInput= document.getElementById('edit-page-number');
        const cancelEditBtn      = document.getElementById('cancel-edit-btn');
        const editSpinner        = document.getElementById('edit-spinner');

        // Delete Modal
        const deleteConfirmModal = document.getElementById('delete-confirm-modal');
        const cancelDeleteBtn    = document.getElementById('cancel-delete-btn');
        const confirmDeleteBtn   = document.getElementById('confirm-delete-btn');
        const deleteSpinner      = document.getElementById('delete-spinner');

        // PDF
        const exportPdfBtn       = document.getElementById('export-pdf-btn');

        // Sort headers
        const sortNameHeader     = document.getElementById('sort-name-header');
        const sortPageHeader     = document.getElementById('sort-page-header');
        const sortNameIndicator  = document.getElementById('sort-name-indicator');
        const sortPageIndicator  = document.getElementById('sort-page-indicator');

        // --------------------------------------------------------
        //  STATE
        // --------------------------------------------------------
        let entries          = [];
        let entryToDeleteId  = null;
        let sortState        = { column: 'name', direction: 'asc' };
        let isOnline         = false;

        // --------------------------------------------------------
        //  TOAST UTILITY
        // --------------------------------------------------------
        let toastTimer = null;
        const toast = document.getElementById('toast');

        function showToast(message, type = 'info') {
            const colors = {
                success: 'bg-emerald-600 text-white',
                error:   'bg-red-600 text-white',
                info:    'bg-slate-600 text-white',
                warning: 'bg-amber-500 text-white'
            };
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3
                               rounded-xl shadow-2xl text-sm font-medium
                               flex items-center gap-2 min-w-[220px] justify-center
                               transition-all duration-400 ${colors[type] || colors.info}`;
            toast.textContent = message;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('hide');
            }, 3000);
        }

        // --------------------------------------------------------
        //  STATUS BADGE
        // --------------------------------------------------------
        function setStatus(online) {
            isOnline = online;
            if (online) {
                dbStatusDot.className  = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
                dbStatusText.textContent = 'Google Sheets — Live';
            } else {
                dbStatusDot.className  = 'w-2 h-2 rounded-full bg-amber-400 inline-block';
                dbStatusText.textContent = 'Offline — Local Cache';
            }
        }

        // --------------------------------------------------------
        //  LOCAL STORAGE CACHE  (fallback / fast first paint)
        // --------------------------------------------------------
        const CACHE_KEY = 'khataIndexEntries';

        function loadCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }

        function saveCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch {}
        }

        // --------------------------------------------------------
        //  API HELPERS
        // --------------------------------------------------------
        const IS_CONFIGURED = APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

        async function apiGet() {
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getAll`, { redirect: 'follow' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function apiPost(body) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method:  'POST',
                redirect: 'follow',
                body:    JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // --------------------------------------------------------
        //  LOADING STATE UI
        // --------------------------------------------------------
        function showLoading() {
            loadingState.classList.remove('hidden');
            tableWrapper.classList.add('hidden');
        }

        function showTable() {
            loadingState.classList.add('hidden');
            tableWrapper.classList.remove('hidden');
        }

        // --------------------------------------------------------
        //  RENDER
        // --------------------------------------------------------
        const renderTable = (entriesToRender) => {
            tableBody.innerHTML = '';
            const isEmpty = entriesToRender.length === 0 && searchBar.value === '';
            noEntriesMessage.classList.toggle('hidden', !isEmpty);

            entriesToRender.forEach(entry => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-700/50 transition-colors';
                row.innerHTML = `
                    <td class="p-3">${entry.letter}</td>
                    <td class="p-3">${entry.name}</td>
                    <td class="p-3">${entry.pageNumber}</td>
                    <td class="p-3 text-center">
                        <button class="edit-btn text-blue-400 hover:text-blue-300 p-1"
                                data-id="${entry.id}" title="Edit">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"/>
                                <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <button class="delete-btn text-red-400 hover:text-red-300 p-1"
                                data-id="${entry.id}" title="Delete">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        };

        // --------------------------------------------------------
        //  SORT + FILTER + RENDER PIPELINE
        // --------------------------------------------------------
        const filterAndRender = () => {
            const term = searchBar.value.toLowerCase();
            const filtered = entries.filter(e => e.name.toLowerCase().includes(term));
            const dir = sortState.direction === 'asc' ? 1 : -1;
            const sorted = [...filtered].sort((a, b) => {
                if (sortState.column === 'name')       return a.name.localeCompare(b.name) * dir;
                if (sortState.column === 'pageNumber') return (a.pageNumber - b.pageNumber) * dir;
                return 0;
            });
            renderTable(sorted);
            updateSortIndicators();
        };

        const updateSortIndicators = () => {
            sortNameIndicator.textContent = '';
            sortPageIndicator.textContent = '';
            const arrow = sortState.direction === 'asc' ? ' ▲' : ' ▼';
            if (sortState.column === 'name')       sortNameIndicator.textContent = arrow;
            if (sortState.column === 'pageNumber') sortPageIndicator.textContent = arrow;
        };

        const handleSort = (column) => {
            sortState.direction = sortState.column === column
                ? (sortState.direction === 'asc' ? 'desc' : 'asc')
                : 'asc';
            sortState.column = column;
            filterAndRender();
        };

        // --------------------------------------------------------
        //  CRUD — add
        // --------------------------------------------------------
        const addEntry = async (name, pageNumber) => {
            if (!name.trim() || !pageNumber) return;

            // Optimistic local entry
            const optimisticEntry = {
                id:         Date.now().toString(),
                letter:     name.trim().charAt(0).toUpperCase(),
                name:       name.trim(),
                pageNumber: parseInt(pageNumber, 10)
            };

            if (!IS_CONFIGURED) {
                // Pure localStorage mode
                entries.push(optimisticEntry);
                saveCache(entries);
                filterAndRender();
                showToast('Entry added (local only — DB not configured)', 'warning');
                return;
            }

            // Show spinner on button
            addBtn.disabled = true;
            addBtnLabel.textContent = 'Saving…';
            addSpinner.classList.remove('hidden');

            try {
                const result = await apiPost({
                    action: 'add',
                    name:   name.trim(),
                    pageNumber
                });
                if (result.error) throw new Error(result.error);

                // Use the server's id
                optimisticEntry.id     = result.id;
                optimisticEntry.letter = result.letter;
                entries.push(optimisticEntry);
                saveCache(entries);
                filterAndRender();
                showToast('✅ Entry saved to Google Sheets', 'success');
            } catch (err) {
                console.error('Add failed:', err);
                showToast('❌ Failed to save — check your connection', 'error');
            } finally {
                addBtn.disabled = false;
                addBtnLabel.textContent = 'Add Entry';
                addSpinner.classList.add('hidden');
            }
        };

        // --------------------------------------------------------
        //  CRUD — update
        // --------------------------------------------------------
        const updateEntry = async (id, newName, newPageNumber) => {
            const idx = entries.findIndex(e => e.id === id);
            if (idx === -1) return;

            const updated = {
                ...entries[idx],
                name:       newName.trim(),
                letter:     newName.trim().charAt(0).toUpperCase(),
                pageNumber: parseInt(newPageNumber, 10)
            };

            if (!IS_CONFIGURED) {
                entries[idx] = updated;
                saveCache(entries);
                filterAndRender();
                showToast('Entry updated (local only)', 'warning');
                return;
            }

            // Show spinner
            document.getElementById('save-edit-btn').disabled = true;
            editSpinner.classList.remove('hidden');

            try {
                const result = await apiPost({ action: 'update', id, name: newName, pageNumber: newPageNumber });
                if (result.error) throw new Error(result.error);

                entries[idx] = updated;
                saveCache(entries);
                filterAndRender();
                showToast('✅ Entry updated in Google Sheets', 'success');
            } catch (err) {
                console.error('Update failed:', err);
                showToast('❌ Update failed — check your connection', 'error');
            } finally {
                document.getElementById('save-edit-btn').disabled = false;
                editSpinner.classList.add('hidden');
            }
        };

        // --------------------------------------------------------
        //  CRUD — delete
        // --------------------------------------------------------
        const deleteEntry = async (id) => {
            if (!IS_CONFIGURED) {
                entries = entries.filter(e => e.id !== id);
                saveCache(entries);
                filterAndRender();
                showToast('Entry deleted (local only)', 'warning');
                return;
            }

            confirmDeleteBtn.disabled = true;
            deleteSpinner.classList.remove('hidden');

            try {
                const result = await apiPost({ action: 'delete', id });
                if (result.error) throw new Error(result.error);

                entries = entries.filter(e => e.id !== id);
                saveCache(entries);
                filterAndRender();
                showToast('🗑️ Entry deleted from Google Sheets', 'success');
            } catch (err) {
                console.error('Delete failed:', err);
                showToast('❌ Delete failed — check your connection', 'error');
            } finally {
                confirmDeleteBtn.disabled = false;
                deleteSpinner.classList.add('hidden');
            }
        };

        // --------------------------------------------------------
        //  MODAL HELPERS
        // --------------------------------------------------------
        const showEditModal = (id) => {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            editIdInput.value         = entry.id;
            editNameInput.value       = entry.name;
            editPageNumberInput.value = entry.pageNumber;
            editModal.classList.remove('hidden');
            editNameInput.focus();
        };
        const hideEditModal   = () => editModal.classList.add('hidden');

        const showDeleteModal = (id) => {
            entryToDeleteId = id;
            deleteConfirmModal.classList.remove('hidden');
        };
        const hideDeleteModal = () => {
            entryToDeleteId = null;
            deleteConfirmModal.classList.add('hidden');
        };

        // --------------------------------------------------------
        //  PDF GENERATION
        // --------------------------------------------------------
        const generatePDF = () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(20);
            doc.text('Khata Index', 14, 22);

            const term     = searchBar.value.toLowerCase();
            const filtered = entries.filter(e => e.name.toLowerCase().includes(term));
            const dir      = sortState.direction === 'asc' ? 1 : -1;
            const sorted   = [...filtered].sort((a, b) => {
                if (sortState.column === 'name')       return a.name.localeCompare(b.name) * dir;
                if (sortState.column === 'pageNumber') return (a.pageNumber - b.pageNumber) * dir;
                return 0;
            });

            doc.autoTable({
                head: [['Letter', 'Name', 'Page Number']],
                body: sorted.map(e => [e.letter, e.name, e.pageNumber]),
                startY: 30,
                theme:  'grid',
                headStyles: { fillColor: [75, 85, 99] }
            });
            doc.save('khata-index.pdf');
        };

        // --------------------------------------------------------
        //  INITIALISATION — load from Sheets (or cache fallback)
        // --------------------------------------------------------
        const init = async () => {
            // Show cached data immediately for fast first paint
            entries = loadCache();
            if (entries.length > 0) {
                showTable();
                filterAndRender();
            } else {
                showLoading();
            }

            if (!IS_CONFIGURED) {
                setStatus(false);
                showTable();
                filterAndRender();
                showToast('⚠️ Add your Apps Script URL to enable cloud sync', 'warning');
                return;
            }

            try {
                const data = await apiGet();
                if (!Array.isArray(data)) throw new Error('Bad response');
                entries = data;
                saveCache(entries);
                setStatus(true);
            } catch (err) {
                console.error('Load from Sheets failed:', err);
                setStatus(false);
                showToast('⚠️ Offline — showing cached data', 'warning');
            } finally {
                showTable();
                filterAndRender();
            }
        };

        // --------------------------------------------------------
        //  EVENT LISTENERS
        // --------------------------------------------------------
        entryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addEntry(nameInput.value, pageNumberInput.value);
            entryForm.reset();
            nameInput.focus();
        });

        searchBar.addEventListener('input', filterAndRender);

        tableBody.addEventListener('click', (e) => {
            const editBtn   = e.target.closest('.edit-btn');
            const deleteBtn = e.target.closest('.delete-btn');
            if (editBtn)   showEditModal(editBtn.dataset.id);
            if (deleteBtn) showDeleteModal(deleteBtn.dataset.id);
        });

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await updateEntry(editIdInput.value, editNameInput.value, editPageNumberInput.value);
            hideEditModal();
        });
        cancelEditBtn.addEventListener('click', hideEditModal);

        confirmDeleteBtn.addEventListener('click', async () => {
            if (entryToDeleteId) await deleteEntry(entryToDeleteId);
            hideDeleteModal();
        });
        cancelDeleteBtn.addEventListener('click', hideDeleteModal);

        exportPdfBtn.addEventListener('click', generatePDF);

        sortNameHeader.addEventListener('click', () => handleSort('name'));
        sortPageHeader.addEventListener('click', () => handleSort('pageNumber'));

        // --------------------------------------------------------
        //  GO!
        // --------------------------------------------------------
        init();
    });
    </script>
</body>
</html>
